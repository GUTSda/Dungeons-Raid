<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dungeon Set Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrapper">
  <div id="gameScaler">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="ui"></div>
    <div id="toast"></div>
  </div>
</div>
<script src="js/state.js"></script>
<script src="js/roles.js"></script>
<script src="js/items.js"></script>
<script src="js/economy.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/combatfx.js"></script>
<script src="js/cinematic.js"></script>
<script src="js/unique.js"></script>

<script src="js/mobai.js"></script>

<script src="js/lobby.js"></script>

<script src="js/game.js"></script>
<script src="js/mobile.js"></script>

<!-- LOGIN SYSTEM (module: harus lewat server http/https, bukan file://) -->
<script type="module" src="js/auth.js"></script>
<script>
  /* penjaga: kalau auth.js gagal dimuat, tampilkan pesan jelas di layar */
  setTimeout(function () {
    if (window.__authReady) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#a02020;color:#fff;font:14px sans-serif;padding:10px;text-align:center';
    d.textContent = location.protocol === 'file:'
      ? 'auth.js gagal: game dibuka dari file://. Jalankan lewat server (localhost / hosting).'
      : 'auth.js gagal dimuat. Buka F12 > Console / Network, cek path js/auth.js atau import Firebase yang 404.';
    document.body.appendChild(d);
  }, 4000);
</script>
</body>
</html>
